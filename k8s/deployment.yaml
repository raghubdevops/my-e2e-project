apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-e2e-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-e2e-app
  template:
    metadata:
      labels:
        app: my-e2e-app
    spec:
      containers:
        - name: my-e2e-app
          #image: raghube2eacr.azurecr.io/my-e2e-app:latest
          image: raghube2eacr.azurecr.io/my-e2e-app:$(tag)
          ports:
            - containerPort: 8080

      